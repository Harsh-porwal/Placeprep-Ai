<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Registration – PlacePrep AI</title>

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body class="bg-slate min-vh-100 d-flex flex-column justify-content-between py-4">

  <!-- Simple Header -->
  <div class="container text-center mb-3">
    <a href="/index.html" class="text-decoration-none d-inline-flex align-items-center gap-2 fs-3 fw-bold text-navy">
      <i class="bi bi-cpu-fill text-primary"></i> PlacePrep <span class="text-primary">AI</span>
    </a>
  </div>

  <!-- Registration Card -->
  <div class="container max-w-700">
    <div class="stat-card p-4 p-md-5 bg-white rounded-4 shadow border">
      <div class="text-center mb-4">
        <h2 class="fw-extrabold text-navy">Create Student Account</h2>
        <p class="text-muted">Start your placement preparation journey with AI guidance.</p>
      </div>

      <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

      <form id="registerForm">
        <div class="row g-3">
          <!-- Full Name -->
          <div class="col-md-6">
            <label for="name" class="form-label fw-semibold">Full Name *</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control" id="name" placeholder="John Doe" required />
            </div>
          </div>

          <!-- Email -->
          <div class="col-md-6">
            <label for="email" class="form-label fw-semibold">Email Address *</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" id="email" placeholder="john.doe@college.edu" required />
            </div>
          </div>

          <!-- Password -->
          <div class="col-md-6">
            <label for="password" class="form-label fw-semibold">Password *</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" minlength="6" placeholder="At least 6 characters" required />
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="col-md-6">
            <label for="confirmPassword" class="form-label fw-semibold">Confirm Password *</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
              <input type="password" class="form-control" id="confirmPassword" minlength="6" placeholder="Repeat password" required />
            </div>
          </div>

          <!-- College -->
          <div class="col-md-12">
            <label for="college" class="form-label fw-semibold">College / University Name</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-building"></i></span>
              <input type="text" class="form-control" id="college" placeholder="National Institute of Technology (NIT)" />
            </div>
          </div>

          <!-- Degree -->
          <div class="col-md-4">
            <label for="degree" class="form-label fw-semibold">Degree</label>
            <select class="form-select" id="degree">
              <option value="B.Tech" selected>B.Tech</option>
              <option value="B.E">B.E</option>
              <option value="M.Tech">M.Tech</option>
              <option value="BCA/MCA">BCA / MCA</option>
              <option value="B.Sc">B.Sc Computer Science</option>
            </select>
          </div>

          <!-- Branch -->
          <div class="col-md-5">
            <label for="branch" class="form-label fw-semibold">Branch / Department</label>
            <select class="form-select" id="branch">
              <option value="Computer Science & Engineering" selected>Computer Science & Eng (CSE)</option>
              <option value="Information Technology">Information Technology (IT)</option>
              <option value="Electronics & Communication">Electronics & Comm (ECE)</option>
              <option value="Electrical Engineering">Electrical Engineering (EE)</option>
              <option value="Mechanical Engineering">Mechanical Engineering</option>
              <option value="Data Science & AI">Data Science & AI</option>
            </select>
          </div>

          <!-- Graduation Year -->
          <div class="col-md-3">
            <label for="graduationYear" class="form-label fw-semibold">Grad Year</label>
            <select class="form-select" id="graduationYear">
              <option value="2025">2025</option>
              <option value="2026" selected>2026</option>
              <option value="2027">2027</option>
              <option value="2028">2028</option>
            </select>
          </div>
        </div>

        <div class="mt-4">
          <button type="submit" id="submitBtn" class="btn btn-primary-custom w-100 py-3 font-semibold shadow-sm">
            <span id="btnText"><i class="bi bi-person-plus me-1"></i> Register Account</span>
            <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
          </button>
        </div>
      </form>

      <div class="text-center mt-4 pt-2 border-top">
        <p class="text-muted mb-0">Already have an account? <a href="/login.html" class="text-primary fw-semibold">Sign In Here</a></p>
      </div>
    </div>
  </div>

  <div class="text-center text-muted small mt-4">
    &copy; 2026 PlacePrep AI Portal
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (Auth.isLoggedIn()) {
        window.location.href = '/dashboard.html';
      }

      const form = document.getElementById('registerForm');
      const alertBox = document.getElementById('alertBox');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.classList.add('d-none');

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const college = document.getElementById('college').value.trim();
        const degree = document.getElementById('degree').value;
        const branch = document.getElementById('branch').value;
        const graduationYear = document.getElementById('graduationYear').value;

        if (password !== confirmPassword) {
          alertBox.textContent = 'Passwords do not match. Please check again.';
          alertBox.classList.remove('d-none');
          return;
        }

        submitBtn.disabled = true;
        btnText.classList.add('d-none');
        btnSpinner.classList.remove('d-none');

        try {
          const res = await API.post('/api/auth/register', {
            name,
            email,
            password,
            confirmPassword,
            college,
            degree,
            branch,
            graduationYear,
          });

          if (res.success) {
            Auth.setAuth(res.token, res.user);
            window.location.href = '/dashboard.html';
          } else {
            alertBox.textContent = res.message || 'Registration failed.';
            alertBox.classList.remove('d-none');
          }
        } catch (err) {
          alertBox.textContent = err.message || 'Error creating account. Please try again.';
          alertBox.classList.remove('d-none');
        } finally {
          submitBtn.disabled = false;
          btnText.classList.remove('d-none');
          btnSpinner.classList.add('d-none');
        }
      });
    });
  </script>
</body>
</html>
