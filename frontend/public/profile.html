<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Profile – PlacePrep AI</title>

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>

  <div class="app-container">
    <!-- Sidebar -->
    <aside class="app-sidebar" id="sidebar">
      <div class="sidebar-header d-flex align-items-center justify-content-between">
        <a href="/index.html" class="text-decoration-none text-white fs-4 fw-bold">
          <i class="bi bi-cpu-fill text-primary"></i> PlacePrep <span class="text-primary">AI</span>
        </a>
        <button class="btn btn-sm btn-link text-white d-lg-none" id="closeSidebar">
          <i class="bi bi-x-lg fs-5"></i>
        </button>
      </div>

      <ul class="sidebar-menu">
        <li><a href="/dashboard.html"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a></li>
        <li><a href="/coding.html"><i class="bi bi-code-slash"></i> Coding Tracker</a></li>
        <li><a href="/companies.html"><i class="bi bi-building"></i> Companies</a></li>
        <li><a href="/resume.html"><i class="bi bi-file-earmark-person"></i> Resume Analyzer</a></li>
        <li><a href="/interview.html"><i class="bi bi-chat-quote"></i> AI Interview</a></li>
        <li><a href="/aptitude.html"><i class="bi bi-calculator"></i> Aptitude</a></li>
        <li><a href="/assistant.html"><i class="bi bi-robot"></i> AI Assistant</a></li>
        <li><a href="/analytics.html"><i class="bi bi-bar-chart-line"></i> Analytics</a></li>
        <li><a href="/profile.html" class="active"><i class="bi bi-person-circle"></i> Profile</a></li>
        <li class="nav-admin-only" style="display: none;"><a href="/admin.html"><i class="bi bi-shield-lock"></i> Admin Panel</a></li>
        <li class="mt-4 border-top border-secondary pt-2">
          <a href="#" id="logoutBtn" class="text-danger"><i class="bi bi-box-arrow-right"></i> Logout</a>
        </li>
      </ul>
    </aside>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="app-content">
      <!-- Top Navbar -->
      <header class="top-navbar">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-outline-secondary d-lg-none" id="toggleSidebar">
            <i class="bi bi-list"></i>
          </button>
          <h4 class="fw-bold text-navy mb-0"><i class="bi bi-person-badge text-primary me-2"></i>Student Profile & Career Goal</h4>
        </div>
      </header>

      <main class="main-body">
        <div class="stat-card p-4 max-w-800 mx-auto">
          <!-- Profile Header Card -->
          <div class="d-flex align-items-center gap-4 mb-4 pb-4 border-bottom flex-wrap">
            <div class="avatar bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold fs-1" style="width: 80px; height: 80px;" id="profileAvatar">
              S
            </div>
            <div>
              <h3 class="fw-bold text-navy mb-1" id="profileNameHeader">Student Name</h3>
              <div class="text-muted small mb-2" id="profileEmailHeader">student@placeprep.ai</div>
              <span class="badge bg-primary px-3 py-1" id="profileGoalBadge">Software Developer</span>
            </div>
          </div>

          <div id="alertBox" class="alert alert-danger d-none"></div>
          <div id="successBox" class="alert alert-success d-none">Profile updated successfully!</div>

          <!-- Edit Profile Form -->
          <form id="profileForm">
            <div class="row g-3">
              <!-- Full Name -->
              <div class="col-md-6">
                <label class="form-label fw-semibold">Full Name</label>
                <input type="text" class="form-control" id="name" required />
              </div>

              <!-- Email (Disabled) -->
              <div class="col-md-6">
                <label class="form-label fw-semibold">Email Address (Read-only)</label>
                <input type="email" class="form-control" id="email" disabled />
              </div>

              <!-- College -->
              <div class="col-md-6">
                <label class="form-label fw-semibold">College / University</label>
                <input type="text" class="form-control" id="college" />
              </div>

              <!-- Degree -->
              <div class="col-md-3">
                <label class="form-label fw-semibold">Degree</label>
                <select class="form-select" id="degree">
                  <option value="B.Tech">B.Tech</option>
                  <option value="B.E">B.E</option>
                  <option value="M.Tech">M.Tech</option>
                  <option value="BCA/MCA">BCA / MCA</option>
                  <option value="B.Sc">B.Sc Computer Science</option>
                </select>
              </div>

              <!-- Graduation Year -->
              <div class="col-md-3">
                <label class="form-label fw-semibold">Graduation Year</label>
                <select class="form-select" id="graduationYear">
                  <option value="2025">2025</option>
                  <option value="2026">2026</option>
                  <option value="2027">2027</option>
                  <option value="2028">2028</option>
                </select>
              </div>

              <!-- Branch -->
              <div class="col-md-6">
                <label class="form-label fw-semibold">Branch / Department</label>
                <input type="text" class="form-control" id="branch" />
              </div>

              <!-- Career Goal -->
              <div class="col-md-6">
                <label class="form-label fw-semibold">Career Goal Target</label>
                <select class="form-select" id="careerGoal">
                  <option value="Software Developer">Software Developer</option>
                  <option value="Data Analyst">Data Analyst</option>
                  <option value="Data Scientist">Data Scientist</option>
                  <option value="Web Developer">Web Developer</option>
                  <option value="Cybersecurity">Cybersecurity Specialist</option>
                  <option value="AI/ML Engineer">AI/ML Engineer</option>
                </select>
              </div>

              <!-- Skills -->
              <div class="col-12">
                <label class="form-label fw-semibold">Technical Skills (Comma separated)</label>
                <input type="text" class="form-control" id="skills" placeholder="e.g. Java, Python, Data Structures, SQL, React, Node.js" />
              </div>

              <!-- GitHub URL -->
              <div class="col-md-6">
                <label class="form-label fw-semibold">GitHub Profile URL</label>
                <input type="url" class="form-control" id="github" placeholder="https://github.com/yourusername" />
              </div>

              <!-- LinkedIn URL -->
              <div class="col-md-6">
                <label class="form-label fw-semibold">LinkedIn Profile URL</label>
                <input type="url" class="form-control" id="linkedin" placeholder="https://linkedin.com/in/yourusername" />
              </div>
            </div>

            <div class="mt-4 text-end">
              <button type="submit" class="btn btn-primary-custom px-4 py-2 font-semibold shadow-sm" id="saveProfileBtn">
                <i class="bi bi-check-circle-fill me-1"></i> Save Profile Changes
              </button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
